<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halal Food Spots</title>
  <meta name="description" content="Halal-Restaurants auf einer interaktiven Karte finden.">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-button" class="menu-button" aria-label="Menü öffnen">
  ☰
</button>

<nav id="side-menu" class="side-menu">
  <button id="menu-close" class="menu-close" aria-label="Menü schließen">
    ×
  </button>

  <h2>Bereiche</h2>

  <button
    class="menu-entry active"
    data-table="Halalfood"
    data-title="Halal Restaurants"
  >
    Restaurants
  </button>

  <button
  class="menu-entry"
  data-table="Metzger"
  data-title="Halal Metzgereien"
>
  Metzgereien
</button>
</nav>

<div id="menu-overlay" class="menu-overlay"></div>
    <div>
      <h1 id="page-title">Halal Restaurants</h1>
      <p id="page-subtitle">Restaurants über Suche und Karte entdecken</p>
    </div>
    <input
      id="search"
      type="search"
      placeholder="Name, Stadt, Kategorie oder Küche suchen …"
      autocomplete="off"
      aria-label="Restaurants durchsuchen"
    >

    <div id="search-suggestions" class="search-suggestions"></div>
    
  </header>

  <main class="layout">
    <section class="map-section">
      <div id="map" aria-label="Karte mit Restaurants"></div>
    </section>

    <aside class="results-section">
      <div class="results-header">
        <h2 id="results-title">Restaurants</h2>
        <span id="result-count">0 Einträge</span>
      </div>

      <div id="status" class="status">Daten werden geladen …</div>
      <div id="restaurant-list" class="restaurant-list"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
